<!-- @dsCard group="Spacing" viewport="700x170" name="Shadows" subtitle="Plain black depth; color comes from glows, not shadows" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
        background: var(--bg-page);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 4px;
      "
    >
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div
          style="
            height: 80px;
            border-radius: var(--radius-lg);
            background: var(--surface-card);
            box-shadow: var(--shadow-lg);
          "
        ></div>
        <span class="mono">--shadow-lg · media, hero</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div
          style="
            height: 80px;
            border-radius: var(--radius-md);
            background: var(--surface-card);
            box-shadow: var(--shadow-sm);
          "
        ></div>
        <span class="mono">--shadow-sm · header</span>
      </div>
    </div>
  </body>
</html>
