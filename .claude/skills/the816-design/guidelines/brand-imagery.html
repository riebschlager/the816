<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      "
    >
      <div
        style="
          aspect-ratio: 4/3;
          border-radius: var(--radius-md);
          overflow: hidden;
          border: 1px solid var(--border-default);
        "
      >
        <img
          src="../assets/images/thundergong-crowd.jpg"
          style="width: 100%; height: 100%; object-fit: cover; display: block"
        />
      </div>
      <div
        style="
          aspect-ratio: 4/3;
          border-radius: var(--radius-md);
          overflow: hidden;
          border: 1px solid var(--border-default);
        "
      >
        <img
          src="../assets/images/thundergong-hatrick-control.jpg"
          style="width: 100%; height: 100%; object-fit: cover; display: block"
        />
      </div>
      <div
        style="
          aspect-ratio: 4/3;
          border-radius: var(--radius-md);
          overflow: hidden;
          border: 1px solid var(--border-default);
        "
      >
        <img
          src="../assets/images/thundergong-backstage-team.jpg"
          style="width: 100%; height: 100%; object-fit: cover; display: block"
        />
      </div>
    </div>
  </body>
</html>
