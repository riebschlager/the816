<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Quick ease-out; a little snap on arrows" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div
      style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px"
      class="mono"
    >
      <div
        style="
          padding: 14px;
          border: 1px solid var(--border-default);
          border-radius: var(--radius-md);
        "
      >
        <div
          style="
            color: var(--text-primary);
            font-size: 20px;
            font-family: var(--font-display);
            font-weight: 700;
          "
        >
          120ms
        </div>
        --dur-fast<br />color, press
      </div>
      <div
        style="
          padding: 14px;
          border: 1px solid var(--border-default);
          border-radius: var(--radius-md);
        "
      >
        <div
          style="
            color: var(--text-primary);
            font-size: 20px;
            font-family: var(--font-display);
            font-weight: 700;
          "
        >
          200ms
        </div>
        --dur-base<br />glow, underline
      </div>
      <div
        style="
          padding: 14px;
          border: 1px solid var(--border-default);
          border-radius: var(--radius-md);
        "
      >
        <div
          style="
            color: var(--text-primary);
            font-size: 20px;
            font-family: var(--font-display);
            font-weight: 700;
          "
        >
          420ms
        </div>
        --dur-slow<br />image zoom
      </div>
    </div>
    <div class="mono" style="margin-top: 12px">
      --ease-out cubic-bezier(.2,.8,.2,1) · --ease-snap
      cubic-bezier(.3,1.4,.5,1)
    </div>
  </body>
</html>
