<!-- @dsCard group="Colors" viewport="700x150" name="Tints + highlights" subtitle="Washes for tags/selection; -hi tones for text on dark" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      "
    >
      <div
        style="
          height: 56px;
          border-radius: var(--radius-md);
          background: var(--tint-pink);
          border: 1px solid
            color-mix(in srgb, var(--neon-pink) 45%, transparent);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 14px;
        "
      >
        <span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-pink);
          "
          >--tint-pink</span
        ><span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-pink-hi);
          "
          >--neon-pink-hi</span
        >
      </div>
      <div
        style="
          height: 56px;
          border-radius: var(--radius-md);
          background: var(--tint-cyan);
          border: 1px solid
            color-mix(in srgb, var(--neon-cyan) 45%, transparent);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 14px;
        "
      >
        <span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-cyan);
          "
          >--tint-cyan</span
        ><span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-cyan-hi);
          "
          >--neon-cyan-hi</span
        >
      </div>
      <div
        style="
          height: 56px;
          border-radius: var(--radius-md);
          background: var(--tint-lime);
          border: 1px solid
            color-mix(in srgb, var(--neon-lime) 45%, transparent);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 14px;
        "
      >
        <span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-lime);
          "
          >--tint-lime</span
        ><span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-lime-hi);
          "
          >--neon-lime-hi</span
        >
      </div>
      <div
        style="
          height: 56px;
          border-radius: var(--radius-md);
          background: var(--tint-orange);
          border: 1px solid
            color-mix(in srgb, var(--neon-orange) 45%, transparent);
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 14px;
        "
      >
        <span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-orange);
          "
          >--tint-orange</span
        ><span
          style="
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-orange-hi);
          "
          >--neon-orange-hi</span
        >
      </div>
    </div>
  </body>
</html>
