<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;margin:0;background:var(--bg-page)} .mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--text-muted)}</style>
</head><body><div style="display:grid;grid-template-columns:150px 1fr;gap:12px 20px;align-items:center;font-size:17px;color:var(--text-primary)">
<span class="mono">link</span><span><a href="#">Dimensional Innovations</a> → <a href="#" style="color:var(--link-hover);text-decoration-color:currentColor">on hover</a></span>
<span class="mono">focus</span><span><span style="outline:var(--focus-outline);outline-offset:3px;border-radius:4px;color:var(--link)">Focused link</span></span>
<span class="mono">eyebrow / labels</span><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--neon-pink)">Selected work</span>
<span class="mono">selection</span><span><span style="background:var(--neon-pink);color:var(--text-on-neon);padding:0 2px">selected text</span></span></div></body></html>
