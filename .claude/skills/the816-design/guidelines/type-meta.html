<!-- @dsCard group="Type" viewport="700x170" name="Mono labels" subtitle="Atkinson Hyperlegible Mono for eyebrows, dates, numbers" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
        background: var(--bg-page);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div
        style="
          font-family: var(--font-mono);
          font-size: var(--text-mono-label);
          letter-spacing: var(--tracking-eyebrow);
          text-transform: uppercase;
          color: var(--neon-pink);
        "
      >
        Project 02 · Live visuals
      </div>
      <div
        style="
          font-family: var(--font-mono);
          font-size: 14px;
          color: var(--text-muted);
        "
      >
        Nov 17, 2024
      </div>
      <div style="display: flex; gap: 20px; align-items: baseline">
        <span
          style="
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-faint);
          "
          >02</span
        ><span
          style="
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 28px;
            letter-spacing: var(--tracking-tight);
          "
          >Thundergong</span
        >
      </div>
    </div>
  </body>
</html>
