<!-- @dsCard group="Brand" viewport="700x220" name="Page atmosphere" subtitle="Cyan haze top-left, pink haze top-right, over ink" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
        background: var(--bg-page);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div
      style="
        height: 172px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-default);
        background:
          radial-gradient(
            circle at 0% 0%,
            color-mix(in srgb, var(--neon-cyan) 14%, transparent),
            transparent 18rem
          ),
          radial-gradient(
            circle at 100% 3rem,
            color-mix(in srgb, var(--neon-pink) 14%, transparent),
            transparent 20rem
          ),
          var(--bg-page);
        display: flex;
        align-items: flex-end;
        padding: 16px;
        box-sizing: border-box;
      "
    >
      <span class="mono">--bg-atmosphere (intensified for card scale)</span>
    </div>
  </body>
</html>
