<!-- @dsCard group="Colors" viewport="700x170" name="Surfaces" subtitle="Near-black ink, stepped up for cards and hovers" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
        background: var(--bg-page);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
      "
    >
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--surface-sunken);
            border: 1px solid var(--border-default);
          "
        ></div>
        <div
          style="font-size: 13px; color: var(--text-primary); font-weight: 700"
        >
          sunken
        </div>
        <div class="mono">--surface-sunken<br />#07070b</div>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--bg-page);
            border: 1px solid var(--border-default);
          "
        ></div>
        <div
          style="font-size: 13px; color: var(--text-primary); font-weight: 700"
        >
          page
        </div>
        <div class="mono">--bg-page<br />#0a0a0f</div>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--surface-card);
            border: 1px solid var(--border-default);
          "
        ></div>
        <div
          style="font-size: 13px; color: var(--text-primary); font-weight: 700"
        >
          card
        </div>
        <div class="mono">--surface-card<br />#13131b</div>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--surface-raised);
            border: 1px solid var(--border-default);
          "
        ></div>
        <div
          style="font-size: 13px; color: var(--text-primary); font-weight: 700"
        >
          raised
        </div>
        <div class="mono">--surface-raised<br />#191923</div>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--surface-hover);
            border: 1px solid var(--border-default);
          "
        ></div>
        <div
          style="font-size: 13px; color: var(--text-primary); font-weight: 700"
        >
          hover
        </div>
        <div class="mono">--surface-hover<br />#1e1e2a</div>
      </div>
    </div>
  </body>
</html>
