<!-- @dsCard group="Spacing" viewport="700x170" name="Layout widths" subtitle="Prose column inside a wider page container" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
        background: var(--bg-page);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div style="display: flex; flex-direction: column; gap: 10px" class="mono">
      <div>
        <div
          style="
            width: 64%;
            height: 22px;
            background: var(--surface-raised);
            border: 1px solid var(--neon-pink);
            border-radius: 4px;
          "
        ></div>
        --container-prose · 720px (posts, about)
      </div>
      <div>
        <div
          style="
            width: 100%;
            height: 22px;
            background: var(--surface-raised);
            border: 1px solid var(--border-strong);
            border-radius: 4px;
          "
        ></div>
        --container-max · 1120px (header, grids)
      </div>
      <div>
        --gutter clamp(20px, 4vw, 40px) · --header-height 64px · --measure 68ch
      </div>
    </div>
  </body>
</html>
