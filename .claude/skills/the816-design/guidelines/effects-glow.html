<!-- @dsCard group="Spacing" viewport="700x170" name="Neon glows" subtitle="Hover/focus only — never at rest" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div style="padding: 12px">
      <div
        style="
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 14px;
        "
      >
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div
            style="
              height: 64px;
              border-radius: var(--radius-md);
              background: var(--surface-card);
              box-shadow: var(--glow-pink);
            "
          ></div>
          <span class="mono">--glow-pink</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div
            style="
              height: 64px;
              border-radius: var(--radius-md);
              background: var(--surface-card);
              box-shadow: var(--glow-cyan);
            "
          ></div>
          <span class="mono">--glow-cyan</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div
            style="
              height: 64px;
              border-radius: var(--radius-md);
              background: var(--surface-card);
              box-shadow: var(--glow-lime);
            "
          ></div>
          <span class="mono">--glow-lime</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div
            style="
              height: 64px;
              border-radius: var(--radius-md);
              background: var(--surface-card);
              box-shadow: var(--glow-orange);
            "
          ></div>
          <span class="mono">--glow-orange</span>
        </div>
      </div>
    </div>
  </body>
</html>
