<!-- @dsCard group="Colors" viewport="700x200" name="Neon accents" subtitle="Four neons; pink leads, the others take supporting roles" -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        padding: 24px;
        margin: 0;
        background: var(--bg-page);
      }
      .mono {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      "
    >
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 72px;
            border-radius: var(--radius-md);
            background: var(--neon-pink);
          "
        ></div>
        <div style="font-size: 14px; font-weight: 700; color: var(--neon-pink)">
          Pink
        </div>
        <div class="mono">--neon-pink<br />#ff0099<br />links · primary</div>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 72px;
            border-radius: var(--radius-md);
            background: var(--neon-cyan);
          "
        ></div>
        <div style="font-size: 14px; font-weight: 700; color: var(--neon-cyan)">
          Cyan
        </div>
        <div class="mono">--neon-cyan<br />#29f0ff<br />focus · info</div>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 72px;
            border-radius: var(--radius-md);
            background: var(--neon-lime);
          "
        ></div>
        <div style="font-size: 14px; font-weight: 700; color: var(--neon-lime)">
          Lime
        </div>
        <div class="mono">--neon-lime<br />#c8ff2e<br />hover · success</div>
      </div>
      <div
        style="display: flex; flex-direction: column; gap: 8px; min-width: 0"
      >
        <div
          style="
            height: 72px;
            border-radius: var(--radius-md);
            background: var(--neon-orange);
          "
        ></div>
        <div
          style="font-size: 14px; font-weight: 700; color: var(--neon-orange)"
        >
          Orange
        </div>
        <div class="mono">--neon-orange<br />#ff8a2b<br />warning · rare</div>
      </div>
    </div>
  </body>
</html>
