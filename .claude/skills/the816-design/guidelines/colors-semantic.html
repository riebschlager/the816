<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;margin:0} .mono{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--text-muted)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:14px;font-size:16px">
 <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center"><a href="#">Default link (--link)</a><a href="#" style="color:var(--link-hover)">Hovered link (--link-hover)</a><span style="padding:6px 10px;box-shadow:var(--focus-outline);border-radius:4px;color:var(--text-primary)">Focus ring</span></div>
 <div style="display:flex;gap:24px;flex-wrap:wrap" class="mono"><span style="color:var(--success)">● --success</span><span style="color:var(--warning)">● --warning</span><span style="color:var(--danger)">● --danger</span><span style="background:var(--neon-pink);color:var(--ink-1000);padding:0 4px">::selection</span></div></div></body></html>
