<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === "object" && v.Button && v.Tag) return v; } catch (e) {} } return {}; })();
const { SiteHeader, SiteFooter } = NS;
function Demo() {
  const [active, setActive] = React.useState("Projects");
  return (<div><SiteHeader active={active} onNavigate={setActive} /><div style={{ height: 8 }} /><div style={{ marginTop: -96 }}><SiteFooter /></div></div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
